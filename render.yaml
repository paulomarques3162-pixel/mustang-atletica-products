services:
  - type: web
    name: mustang-atletica-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_API_KEY
        sync: false
      - key: PAYMENT_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_ENVIRONMENT
        value: sandbox
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: SHIPPING_FLAT_FEE
        sync: false
      - key: LOG_LEVEL
        value: info
